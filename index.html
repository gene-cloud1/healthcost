<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>비급여진료비탐색서비스</title>
</head>
<body>
<h1 style="color:#000;">비급여진료비탐색서비스</h1>

<input id="value-input" type="text" placeholder="값 입력">
<button id="save-btn">저장</button>

<ul id="list"></ul>

<hr>

<h2>진료 항목 검색</h2>
<input id="search-input" type="text" placeholder="예: 독감주사">
<button id="search-btn">검색</button>
<p id="search-result"></p>

<script>
function render(items) {
  var list = document.getElementById('list')
  list.innerHTML = ''
  items.forEach(function (item) {
    var li = document.createElement('li')
    li.textContent = item
    list.appendChild(li)
  })
}

fetch('/api/items')
  .then(function (res) { return res.json() })
  .then(function (data) { render(data.items) })

document.getElementById('save-btn').addEventListener('click', function () {
  var input = document.getElementById('value-input')
  var value = input.value
  if (!value) return
  fetch('/api/items', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ value: value }),
  })
    .then(function (res) { return res.json() })
    .then(function (data) {
      render(data.items)
      input.value = ''
    })
})

document.getElementById('search-btn').addEventListener('click', function () {
  var input = document.getElementById('search-input')
  var query = input.value
  var result = document.getElementById('search-result')
  if (!query.trim()) return
  fetch('/api/match?q=' + encodeURIComponent(query))
    .then(function (res) { return res.json() })
    .then(function (data) {
      if (data.matched) {
        result.textContent = '"' + query + '" → 공식 항목명: ' + data.official
      } else {
        result.textContent = '매칭되는 항목을 찾지 못했어요.'
      }
    })
})
</script>
</body>
</html>
